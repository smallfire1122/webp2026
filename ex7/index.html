<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex7</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 30px;
        }

        #container {
            font-size: 48px;
            padding: 20px;
            min-height: 100px;
            border: 2px solid #ccc;
            border-radius: 10px;
            background-color: white;
            word-break: break-all;
        }

        #infoPanel, #messagePanel, #logPanel {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background-color: white;
            border: 1px solid #ddd;
        }

        #messagePanel {
            font-size: 20px;
            font-weight: bold;
        }

        .target-char {
            color: red;
            font-weight: bold;
            font-size: 60px;
        }

        #wrongList {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4">簡單的打字機</h1>

        <div id="container" tabindex="0"></div>

        <div id="domArea"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
