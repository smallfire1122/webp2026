<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex8 Ajax 實作練習</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4efe6;
      --card: #fffdf8;
      --text: #213547;
      --muted: #5f6b76;
      --accent: #b85c38;
      --accent-dark: #8f4529;
      --line: #e7d9c8;
      --head: #f2e3d3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(184, 92, 56, 0.12), transparent 28%),
        linear-gradient(180deg, #f8f2ea 0%, var(--bg) 100%);
      color: var(--text);
    }

    .container {
      width: min(1800px, calc(100% - 24px));
      margin: 40px auto;
    }

    .hero,
    .table-card {
      background: var(--card);
      border: 1px solid rgba(184, 92, 56, 0.12);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(72, 51, 34, 0.08);
    }

    .hero {
      padding: 28px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.9rem, 3vw, 2.6rem);
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.7;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: var(--accent-dark);
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.7;
      transform: none;
    }

    .status {
      min-height: 24px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .table-card {
      overflow: hidden;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1650px;
    }

    thead {
      background: var(--head);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      text-align: left;
      vertical-align: top;
      line-height: 1.6;
    }

    th {
      font-size: 0.95rem;
    }

    th:nth-child(1),
    td:nth-child(1) {
      width: 28%;
    }

    th:nth-child(2),
    td:nth-child(2) {
      width: 18%;
    }

    th:nth-child(3),
    td:nth-child(3) {
      width: 20%;
    }

    th:nth-child(4),
    td:nth-child(4) {
      width: 15%;
    }

    th:nth-child(5),
    td:nth-child(5) {
      width: 14%;
    }

    th:nth-child(6),
    td:nth-child(6) {
      width: 8%;
      min-width: 120px;
      white-space: nowrap;
    }

    tbody tr:hover {
      background: rgba(184, 92, 56, 0.04);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px 16px;
    }

    a {
      color: var(--accent-dark);
    }

    @media (max-width: 720px) {
      .container {
        width: min(100% - 20px, 1800px);
        margin: 20px auto;
      }

      .hero,
      .table-card {
        border-radius: 16px;
      }

      .hero {
        padding: 22px 18px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>景點觀光展覽資訊</h1>
      <p class="subtitle">
        透過 Ajax 讀取文化部展演活動 API，並將資料呈現在表格中。
      </p>
      <div class="controls">
        <button id="loadButton" type="button">載入展覽資料</button>
      </div>
      <p id="status" class="status">按下按鈕後開始讀取資料。</p>
    </section>

    <section class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>名稱</th>
              <th>地點</th>
              <th>展出時間</th>
              <th>票價</th>
              <th>主辦單位</th>
              <th>相關連結</th>
            </tr>
          </thead>
          <tbody id="dataBody">
            <tr>
              <td class="empty" colspan="6">尚未載入資料</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
