<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ex9 Flickr Photo Wall</title>
  <style>
    :root {
      --gap: 8px;
      --bg: #f3efe7;
      --card: rgba(255, 255, 255, 0.86);
      --text: #1f2933;
      --muted: #566370;
      --accent: #c24d2c;
      --line: rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(194, 77, 44, 0.18), transparent 25%),
        radial-gradient(circle at bottom right, rgba(24, 119, 242, 0.12), transparent 30%),
        linear-gradient(180deg, #f8f5ef 0%, var(--bg) 100%);
    }

    main {
      width: min(1180px, calc(100% - 24px));
      margin: 28px auto 36px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(31, 41, 51, 0.08);
      backdrop-filter: blur(8px);
    }

    .hero {
      padding: 28px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3rem);
    }

    .subtitle,
    .json-note,
    .status {
      color: var(--muted);
      line-height: 1.7;
    }

    .subtitle {
      margin: 0 0 18px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.75;
      transform: none;
    }

    .status {
      min-height: 26px;
      margin: 16px 0 0;
    }

    .json-note {
      margin: 10px 0 0;
      font-size: 0.95rem;
    }

    .gallery-card {
      padding: 22px;
    }

    .gallery {
      display: grid;
      width: min(100%, 1024px);
      margin: 0 auto;
      aspect-ratio: 1;
      grid: auto-flow 1fr / repeat(3, 1fr);
      gap: var(--gap);
    }

    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: #ddd;
      box-shadow: 0 12px 26px rgba(31, 41, 51, 0.1);
    }

    .photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: grayscale(1);
      transition: transform 0.45s ease, filter 0.45s ease;
    }

    .photo:hover img {
      filter: grayscale(0);
      transform: scale(1.04);
    }

    .photo:nth-child(2) {
      grid-area: 1 / 2 / span 2 / span 2;
      clip-path: polygon(
        0 0,
        100% 0,
        100% 100%,
        calc(50% + var(--gap) / 4) 100%,
        0 calc(50% - var(--gap) / 4)
      );
    }

    .photo:nth-child(3) {
      grid-area: 2 / 1 / span 2 / span 2;
      clip-path: polygon(
        0 0,
        calc(50% - var(--gap) / 4) 0,
        100% calc(50% + var(--gap) / 4),
        100% 100%,
        0 100%
      );
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 14px;
      color: #fff;
      background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.72) 100%);
      font-size: 0.92rem;
    }

    .placeholder {
      width: min(100%, 1024px);
      margin: 0 auto;
      min-height: 280px;
      display: grid;
      place-items: center;
      border: 2px dashed rgba(31, 41, 51, 0.16);
      border-radius: 22px;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      line-height: 1.8;
    }

    @media (max-width: 820px) {
      .hero,
      .gallery-card {
        padding: 18px;
      }

      .gallery {
        aspect-ratio: auto;
        grid-template-columns: 1fr;
        grid-auto-rows: 240px;
      }

      .photo:nth-child(2),
      .photo:nth-child(3) {
        grid-area: auto;
        clip-path: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel hero">
      <h1>隨機照片牆</h1>
      <p class="subtitle">
        點選按鈕生成一面新的隨機照片牆，看看這次會出現哪些 Flickr 公開照片。
      </p>
      <div class="toolbar">
        <button id="loadButton" type="button">Get IMG</button>
      </div>
      <p id="status" class="status">點選按鈕後生成照片牆。</p>
      <p class="json-note">每次點擊都會重新整理這一面照片牆。</p>
    </section>

    <section class="panel gallery-card">
      <div id="galleryWrapper" class="placeholder">
        尚未載入圖片<br>
        點擊上方按鈕後，這裡會顯示 Flickr 照片牆。
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
