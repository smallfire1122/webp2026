<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HW4 Ajax Table Update</title>
  <style>
    :root {
      --page-bg: #fafafa;
      --frame: #e8b44a;
      --title: #151515;
      --text: #2c2c2c;
      --muted: #666;
      --header-bg: #06b26b;
      --header-border: #73d7ae;
      --row-odd: #ececec;
      --row-even: #ffffff;
      --line: #dddddd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: var(--page-bg);
      color: var(--text);
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 18px 30px;
      border: 3px dotted var(--frame);
      background: #fff;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 16px;
    }

    .heading-group {
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
      line-height: 1.1;
      color: var(--title);
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search label {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .search input {
      width: 230px;
      height: 48px;
      padding: 8px 12px;
      border: 2px solid #333;
      font-size: 1.75rem;
    }

    .logo {
      font-size: 1rem;
      color: #d89200;
      font-weight: 700;
      white-space: nowrap;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 900px;
    }

    thead th {
      background: var(--header-bg);
      color: #fff;
      border-right: 2px solid var(--header-border);
      padding: 12px 10px;
      font-size: 1.1rem;
      text-align: left;
    }

    thead th:last-child {
      border-right: 0;
    }

    tbody td {
      padding: 12px 10px;
      border: 1px solid var(--line);
      font-size: 1.05rem;
      font-weight: 700;
      vertical-align: top;
      line-height: 1.35;
      word-break: break-word;
    }

    tbody tr:nth-child(odd) td {
      background: var(--row-odd);
    }

    tbody tr:nth-child(even) td {
      background: var(--row-even);
    }

    .col-title {
      width: 48%;
    }

    .col-location {
      width: 30%;
    }

    .col-price {
      width: 22%;
    }

    .status {
      margin: 14px 0 10px;
      min-height: 24px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .pager {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .pager button {
      min-width: 82px;
      padding: 8px 14px;
      font-size: 1rem;
      cursor: pointer;
    }

    .pager button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .page-info {
      font-size: 1.2rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 900px) {
      body {
        padding: 12px;
      }

      .page {
        padding: 16px 12px 22px;
      }

      h1 {
        font-size: 2.3rem;
      }

      .search input {
        width: 180px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="heading-group">
        <h1>景點觀光展覽資訊</h1>
        <div class="search">
          <label for="keyword">搜尋</label>
          <input id="keyword" type="text" placeholder="輸入名稱關鍵字">
        </div>
      </div>
      <div class="logo">小火帥哥</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-title">名稱</th>
            <th class="col-location">地點</th>
            <th class="col-price">票價</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td class="empty" colspan="3">資料載入中...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <p id="status" class="status">正在讀取 API 資料...</p>

    <div class="pager">
      <button id="prevBtn" type="button">上一頁</button>
      <span id="pageInfo" class="page-info">1 / 1 頁</span>
      <button id="nextBtn" type="button">下一頁</button>
    </div>
  </div>

  <script>
    const API_URL =
      "https://cloud.culture.tw/frontsite/trans/SearchShowAction.do?method=doFindTypeJ&category=6";

    const ITEMS_PER_PAGE = 10;

    const tableBody = document.getElementById("tableBody");
    const statusText = document.getElementById("status");
    const keywordInput = document.getElementById("keyword");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageInfo = document.getElementById("pageInfo");

    let allData = [];
    let filteredData = [];
    let currentPage = 1;

    function getLocationText(item) {
      if (Array.isArray(item.showInfo) && item.showInfo.length > 0) {
        return item.showInfo[0].location || item.showInfo[0].locationName || "無資料";
      }

      return "無資料";
    }

    function updateStatus(message) {
      statusText.textContent = message;
    }

    function getPriceText(item) {
      if (Array.isArray(item.showInfo) && item.showInfo.length > 0) {
        return item.showInfo[0].price || "免費或未提供";
      }

      return "免費或未提供";
    }

    function renderTable() {
      tableBody.innerHTML = "";

      if (filteredData.length === 0) {
        const row = document.createElement("tr");
        row.innerHTML = '<td class="empty" colspan="3">查無符合條件的資料</td>';
        tableBody.appendChild(row);
        return;
      }

      const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageData = filteredData.slice(startIndex, startIndex + ITEMS_PER_PAGE);

      pageData.forEach((item) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${item.title || "無資料"}</td>
          <td>${getLocationText(item)}</td>
          <td>${getPriceText(item)}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function updatePagination() {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / ITEMS_PER_PAGE));

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      pageInfo.textContent = `${currentPage} / ${totalPages} 頁`;
      prevBtn.disabled = currentPage === 1;
      nextBtn.disabled = currentPage === totalPages || filteredData.length === 0;
    }

    function applyFilter() {
      const keyword = keywordInput.value.trim();

      if (!keyword) {
        filteredData = [...allData];
      } else {
        filteredData = allData.filter((item) => {
          const title = item.title || "";
          return title.includes(keyword);
        });
      }

      currentPage = 1;
      renderTable();
      updatePagination();
      updateStatus(`目前共有 ${filteredData.length} 筆符合資料。`);
    }

    function goToPage(page) {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / ITEMS_PER_PAGE));

      if (page < 1 || page > totalPages) {
        return;
      }

      currentPage = page;
      renderTable();
      updatePagination();
    }

    function fetchData() {
      const xhr = new XMLHttpRequest();

      xhr.open("GET", API_URL, true);
      xhr.responseType = "json";

      xhr.onload = function () {
        if (xhr.status >= 200 && xhr.status < 300) {
          allData = xhr.response || JSON.parse(xhr.responseText);
          filteredData = [...allData];
          currentPage = 1;
          renderTable();
          updatePagination();
          updateStatus(`資料載入完成，共 ${allData.length} 筆。`);
          return;
        }

        tableBody.innerHTML = '<tr><td class="empty" colspan="3">資料讀取失敗</td></tr>';
        updateStatus(`讀取失敗，HTTP 狀態碼：${xhr.status}`);
      };

      xhr.onerror = function () {
        tableBody.innerHTML = '<tr><td class="empty" colspan="3">無法連線到 API</td></tr>';
        updateStatus("Ajax 請求失敗，請確認網路或改用本機伺服器開啟。");
      };

      xhr.send();
    }

    keywordInput.addEventListener("change", applyFilter);
    prevBtn.addEventListener("click", function () {
      goToPage(currentPage - 1);
    });
    nextBtn.addEventListener("click", function () {
      goToPage(currentPage + 1);
    });

    fetchData();
  </script>
</body>
</html>
